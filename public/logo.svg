<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="R monogram logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e8ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="edgeRev" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22e8ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e8ff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#7c6cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="R" fill-rule="evenodd" d="M190 150H292C340 150 372 178 372 214C372 244 354 266 326 276L376 362H328L284 282H232V362H190ZM232 188V248H290C312 248 326 236 326 218C326 200 312 188 290 188Z"/>
    <clipPath id="clipR"><use href="#R"/></clipPath>
  </defs>

  <!-- hexagonal frame -->
  <polygon points="256,56 429,156 429,356 256,456 83,356 83,156" fill="none" stroke="url(#edge)" stroke-width="2" stroke-linejoin="round" opacity="0.9"/>
  <polygon points="256,72 415,164 415,348 256,440 97,348 97,164" fill="none" stroke="url(#edgeRev)" stroke-width="0.8" opacity="0.35"/>
  <circle cx="256" cy="56" r="3.5" fill="#22e8ff"/>
  <circle cx="256" cy="456" r="3.5" fill="#a855f7"/>

  <g transform="translate(-27 0)">
    <use href="#R" transform="translate(7 5)" fill="#a855f7" opacity="0.35" filter="url(#glow)"/>
    <use href="#R" transform="translate(-6 -4)" fill="#22e8ff" opacity="0.30" filter="url(#glow)"/>
    <use href="#R" fill="url(#glass)"/>
    <g clip-path="url(#clipR)">
      <polygon points="180,140 260,140 200,380 180,380" fill="#ffffff" opacity="0.10"/>
      <polygon points="300,150 340,150 400,370 350,370" fill="#ffffff" opacity="0.07"/>
      <path d="M190 150L376 362" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
      <path d="M232 250H320" stroke="#22e8ff" stroke-width="2" opacity="0.6"/>
    </g>
    <use href="#R" fill="none" stroke="url(#edge)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
    <use href="#R" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round" opacity="0.7"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
